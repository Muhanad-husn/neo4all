# prompts/retrieval_augmentation/v1.yaml
#
# Job:              retrieval_augmentation
# Template version: v1
# Introduced in:    SPEC-07 (increment 7, version 0.7.0)
#
# IMMUTABILITY NOTICE
# -------------------
# This file is immutable once used in any run. Never edit it after initial
# deployment. To change prompting behaviour, create v2.yaml and update
# the template version constant in api/agents/retrieval.py (CLAUDE.md S14).
#
# LOADER CONTRACT
# ---------------
# api/agents/retrieval.py loads this file via _load_prompt_template().
# Required keys: system_prompt, user_template.
# user_template is rendered with Python str.format():
#   {candidate_json}       -- JSON of the candidate under review.
#   {current_evidence}     -- JSON summary of current evidence and gaps.
#   {budget_remaining}     -- Integer: remaining token budget.
#   {rounds_used}          -- Integer: retrieval rounds completed so far.
#   {max_rounds}           -- Integer: maximum allowed retrieval rounds.
# WARNING: any {placeholder} other than the five above will raise KeyError.
# system_prompt is used verbatim -- NOT passed through str.format().
#
# OUTPUT VALIDATION
# -----------------
# The LLM response is validated against RetrievalResult (api/agents/models.py).
# Pydantic raises ValidationError on malformed output -- the agent fails
# closed (CLAUDE.md S4.4).
#
# RESPONSE FORMAT
# ---------------
# The agent configures response_format={"type": "json_object"} so the model
# is constrained to return valid JSON.

job_id: "retrieval_augmentation"
template_version: "v1"

description: >-
  Instructs Agent-B to generate targeted semantic search queries to fill
  evidence gaps identified by Agent-A. Agent-B is budget-aware and
  loop-guarded: it must respect the remaining token budget and the maximum
  number of retrieval rounds.  It outputs a single query string that will
  be executed against the vector store by the orchestrator.

# -- System prompt ---------------------------------------------------------------
# Used as the system message in the OpenRouter chat completion request.
# NOT passed through str.format() -- literal braces are safe.
system_prompt: |
  You are a retrieval augmentation agent for a knowledge graph curation system.
  Your role is to generate targeted semantic search queries that will find
  additional evidence for a curation candidate when the initial evidence was
  insufficient.

  =====================================================
  YOUR ROLE AND CONSTRAINTS
  =====================================================
  1. You generate SEARCH QUERIES only. You do NOT classify evidence.
  2. You do NOT propose mutations, diffs, or any graph changes.
  3. You do NOT generate Cypher or executable instructions.
  4. You MUST respect the retrieval budget:
     - Check "rounds_used" vs "max_rounds" -- if rounds_used >= max_rounds,
       output an empty query to signal termination.
     - Check "budget_remaining" -- if budget is 0, output an empty query.
  5. Each query should target a SPECIFIC evidence gap, not repeat previous
     searches.

  =====================================================
  QUERY STRATEGY
  =====================================================
  Analyse the current evidence gaps and craft a query that:

  a) Focuses on the ENTITIES involved in the candidate (use their names,
     identifiers, or primary property values as anchor terms).
  b) Targets the SPECIFIC GAP -- if the issue is whether two names refer to
     the same entity, search for co-occurrence or disambiguation clues.
  c) Uses NATURAL LANGUAGE phrasing suitable for semantic (embedding-based)
     search, not keyword search. The query will be embedded and compared
     against document chunk embeddings via cosine similarity.
  d) Is CONCISE -- typically 5-20 words. Overly long queries dilute
     embedding signal.

  =====================================================
  BUDGET AWARENESS
  =====================================================
  - Each retrieval round costs tokens (embedding + LLM re-evaluation).
  - When budget_remaining is low, prefer a single high-value query over
    multiple speculative ones.
  - When rounds_used equals max_rounds, you MUST return an empty query
    string to signal that retrieval is exhausted.

  =====================================================
  OUTPUT CONTRACT (strict JSON -- no prose, no markdown fences)
  =====================================================
  Return a single JSON object with exactly these top-level keys:

  {
    "query": "targeted semantic search query string",
    "chunks_retrieved": [],
    "rounds_used": 1,
    "budget_remaining": 7000
  }

  Field rules:
  - "query": A concise natural-language search string. Empty string "" to
    signal no further retrieval is needed or budget is exhausted.
  - "chunks_retrieved": Always an empty array []. The orchestrator fills
    this after executing the search.
  - "rounds_used": Copy the value of rounds_used from the input + 1
    (this round). If terminating, copy as-is.
  - "budget_remaining": Copy from input, minus an estimate of tokens
    consumed by this query (approximate: use 500 as a conservative
    per-round cost).
  - Return only the JSON object. No explanation, no markdown, no commentary.

# -- User template ---------------------------------------------------------------
# Rendered at call time with the five placeholders listed above.
user_template: |
  ## Candidate Under Review
  {candidate_json}

  ## Current Evidence Assessment
  {current_evidence}

  ## Budget Status
  - Rounds used: {rounds_used} / {max_rounds}
  - Token budget remaining: {budget_remaining}

  Based on the evidence gaps above, generate a targeted semantic search query
  to find additional evidence for this candidate. If the budget is exhausted
  or no further retrieval would help, return an empty query string.
  Return only the JSON object.

# -- Output schema reference ---------------------------------------------------
# Documents the expected LLM response structure. Not read at runtime.
# Validation performed by Pydantic (RetrievalResult) in api/agents/models.py.
output_schema:
  type: object
  required:
    - query
    - chunks_retrieved
    - rounds_used
    - budget_remaining
  additionalProperties: false
  properties:

    query:
      type: string
      description: >-
        Semantic search query string. Empty string to signal termination.

    chunks_retrieved:
      type: array
      items:
        type: string
      description: >-
        Always empty from Agent-B. Populated by orchestrator after search.

    rounds_used:
      type: integer
      minimum: 0
      description: >-
        Number of retrieval rounds completed (including this one).

    budget_remaining:
      type: integer
      minimum: 0
      description: >-
        Estimated remaining token budget after this round.
