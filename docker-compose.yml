version: "3.9"

services:
  api:
    image: muhanaddocker/neo4all-api:latest
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=http://rustfs:9000
      - LOG_FORMAT=json
      - PROMPTS_DIR=/app/prompts
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      rustfs:
        condition: service_started
    restart: unless-stopped

  worker:
    image: muhanaddocker/neo4all-worker:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=http://rustfs:9000
      - LOG_FORMAT=json
      - PROMPTS_DIR=/app/prompts
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      rustfs:
        condition: service_started
    restart: unless-stopped

  ui:
    image: muhanaddocker/neo4all-ui:latest
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${S3_SECRET_ACCESS_KEY}
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  rustfs_data:
